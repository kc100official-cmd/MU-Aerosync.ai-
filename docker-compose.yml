version: '3.8'

services:
  chainforensix-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chainforensix_ai
    ports:
      - "8000:8000"
    environment:
      - EVM_RPC_URL=
      - ANCHOR_CONTRACT_ADDRESS=0x742d35Cc6634C0532925a3b844Bc454e4438f44e
      - ANCHOR_PRIVATE_KEY=
    restart: unless-stopped

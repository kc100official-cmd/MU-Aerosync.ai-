name: ChainForensix AI CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup C++ Compiler (GCC)
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make

    - name: Compile Native C++ Graph Tracer
      run: |
        make -C engine
        ./engine/graph_tracer --help || true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite
      run: |
        python -m unittest discover tests
